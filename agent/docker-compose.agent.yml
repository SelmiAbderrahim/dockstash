# Dockstash fleet agent — runs standalone on each remote VPS you back up.
# NOT part of the main Dockstash stack. Set two variables and bring it up:
#
#   DOCKSTASH_URL=https://dockstash.com \
#   DOCKSTASH_AGENT_TOKEN=dsa_<agentId>.<secret> \
#   docker compose -f docker-compose.agent.yml pull \
#   && docker compose -f docker-compose.agent.yml up -d --force-recreate
#
# Same least-privilege posture as the main stack: the agent reaches Docker
# only through a socket proxy that allows exactly CONTAINERS + EXEC.
services:
  docker-socket-proxy:
    image: tecnativa/docker-socket-proxy:0.3.0
    restart: unless-stopped
    environment:
      CONTAINERS: 1
      EXEC: 1
      POST: 1
      INFO: 1
      # everything else stays 0 (deny) — matches the main stack's proxy
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # NOTE: the proxy keeps zero capabilities; only the agent below adds
    # the read-only DAC_READ_SEARCH bypass.

  agent:
    # Dockstash ships no prebuilt image and no registry account — every
    # install publishes its own. Set AGENT_IMAGE to your repository, or
    # leave it and build/push `dockstash/agent` yourself.
    # See docs/fleet-agents.en.md § "Build and publish the agent image".
    image: ${AGENT_IMAGE:-dockstash/agent:latest}
    restart: unless-stopped
    depends_on:
      - docker-socket-proxy
    environment:
      DOCKSTASH_URL: ${DOCKSTASH_URL}
      DOCKSTASH_AGENT_TOKEN: ${DOCKSTASH_AGENT_TOKEN}
      DOCKER_HOST: tcp://docker-socket-proxy:2375
      # Comma-separated directories the agent may discover/back up/restore.
      # Every root listed here MUST also be bind-mounted below, same path
      # inside and out.
      DOCKSTASH_PROJECT_ROOTS: /var/www
    volumes:
      # Project roots — one line per entry in DOCKSTASH_PROJECT_ROOTS.
      # Mounted rw because restores write files back; backups only read.
      # WARNING: removing/mis-mounting these breaks project discovery — the
      # Add-Project folder picker will show empty with no obvious cause. See
      # "Troubleshooting empty folders" in docs/fleet-agents.en.md.
      - /var/www:/var/www:rw
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      # Read-only DAC bypass: restic can read every file regardless of
      # mode/owner, so backups work without loosening permissions on the
      # project tree (never chmod your projects to "fix" a backup).
      # DAC_OVERRIDE stays dropped — this grants NO write bypass; backups
      # remain physically unable to modify protected files.
      - DAC_READ_SEARCH
