# Docker Compose Template for iReadYouTube Project
# This template provides a comprehensive foundation for Docker-based development

version: '3.8'

services:
  # =============================================================================
  # REDIS - Caching and Session Storage
  # =============================================================================
  redis:
    image: ${REDIS_IMAGE:-redis:7-alpine}
    container_name: ${REDIS_CONTAINER_NAME:-ireadyoutube-redis}
    ports:
      - "${REDIS_HOST_PORT:-6379}:${REDIS_CONTAINER_PORT:-6379}"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-}
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
    healthcheck:
      test: ["CMD", "sh", "-c", "redis-cli ${REDIS_PASSWORD:+-a $REDIS_PASSWORD} ping || exit 1"]
      interval: ${HEALTH_CHECK_INTERVAL:-30s}
      timeout: ${HEALTH_CHECK_TIMEOUT:-10s}
      retries: ${HEALTH_CHECK_RETRIES:-3}
      start_period: ${HEALTH_CHECK_START_PERIOD:-10s}
    networks:
      - ${DOCKER_NETWORK_NAME:-ireadyoutube-network}
    restart: ${REDIS_RESTART_POLICY:-unless-stopped}
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 128M
          cpus: '0.1'
    labels:
      - "traefik.enable=false"
      - "com.iareadyoutube.service=redis"

  # =============================================================================
  # CONVEX BACKEND - Self-Hosted Database and Functions
  # =============================================================================
  convex-backend:
    image: ${NODE_IMAGE:-node:20-alpine}
    container_name: ${CONVEX_CONTAINER_NAME:-ireadyoutube-convex-backend}
    ports:
      - "${CONVEX_API_HOST_PORT:-3210}:${CONVEX_API_CONTAINER_PORT:-3210}"
      - "${CONVEX_DASHBOARD_HOST_PORT:-6791}:${CONVEX_DASHBOARD_CONTAINER_PORT:-6791}"
    volumes:
      - convex_backend_data:/app/convex/.convex
      - ${CLIENT_VOLUME_SOURCE:-../client}:${CLIENT_MOUNT_PATH:-/app}:ro
      - ${CLIENT_NODE_MODULES_PATH:-/app/node_modules}
      - convex_uploads:${CONVEX_UPLOADS_PATH:-/app/convex/uploads}
    working_dir: ${CONVEX_WORKING_DIR:-/app}
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - CONVEX_SELF_HOSTED_URL=http://0.0.0.0:${CONVEX_API_CONTAINER_PORT:-3210}
      - CONVEX_ADMIN_KEY=${CONVEX_ADMIN_KEY}
      - CONVEX_SITE_URL=${CONVEX_SITE_URL:-http://localhost:5173}
      - REDIS_URL=redis://redis:${REDIS_CONTAINER_PORT:-6379}
      - ASSEMBLYAI_API_KEY=${ASSEMBLYAI_API_KEY}
      - ASSEMBLYAI_WEBHOOK_SECRET=${ASSEMBLYAI_WEBHOOK_SECRET}
      - ASSEMBLYAI_BASE_URL=${ASSEMBLYAI_BASE_URL:-https://api.assemblyai.com}
      - YOUTUBE_API_KEY=${YOUTUBE_API_KEY}
      - RESEND_API_KEY=${RESEND_API_KEY}
      - RESEND_FROM_EMAIL=${RESEND_FROM_EMAIL}
      - RESEND_FROM_NAME=${RESEND_FROM_NAME}
      - JWT_SECRET=${JWT_SECRET}
      - SESSION_SECRET=${SESSION_SECRET}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
    command: sh -c "
      npm install convex@latest &&
      npx convex dev --once"
    healthcheck:
      test: ["CMD", "sh", "-c", "curl -f http://localhost:${CONVEX_API_CONTAINER_PORT:-3210}/mutation || exit 1"]
      interval: ${HEALTH_CHECK_INTERVAL:-30s}
      timeout: ${HEALTH_CHECK_TIMEOUT:-10s}
      retries: ${HEALTH_CHECK_RETRIES:-3}
      start_period: ${CONVEX_HEALTH_CHECK_START_PERIOD:-60s}
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - ${DOCKER_NETWORK_NAME:-ireadyoutube-network}
    restart: ${CONVEX_RESTART_POLICY:-unless-stopped}
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'
        reservations:
          memory: 512M
          cpus: '0.5'
    labels:
      - "traefik.enable=false"
      - "com.iareadyoutube.service=convex-backend"

  # =============================================================================
  # FRONTEND - React Application with Vite
  # =============================================================================
  client:
    image: ${NODE_IMAGE:-node:20-alpine}
    container_name: ${CLIENT_CONTAINER_NAME:-ireadyoutube-client}
    ports:
      - "${CLIENT_HOST_PORT:-5173}:${CLIENT_CONTAINER_PORT:-5173}"
    volumes:
      - ${CLIENT_VOLUME_SOURCE:-../client}:${CLIENT_MOUNT_PATH:-/app}
      - ${CLIENT_NODE_MODULES_PATH:-/app/node_modules}
    working_dir: ${CLIENT_WORKING_DIR:-/app}
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - VITE_CONVEX_URL=http://localhost:${CONVEX_API_HOST_PORT:-3210}
      - REDIS_URL=redis://redis:${REDIS_CONTAINER_PORT:-6379}
      - CONVEX_SELF_HOSTED_URL=http://localhost:${CONVEX_API_HOST_PORT:-3210}
      - CONVEX_ADMIN_KEY=${CONVEX_ADMIN_KEY}
      - CONVEX_SITE_URL=${CONVEX_SITE_URL:-http://localhost:5173}
      - CHOKIDAR_USEPOLLING=${CHOKIDAR_USEPOLLING:-true}
      - CHOKIDAR_INTERVAL=${CHOKIDAR_INTERVAL:-1000}
    command: sh -c "
      if [ \"${NODE_ENV}\" = \"production\" ]; then
        npm install &&
        npm run build &&
        npm start
      else
        npm install &&
        npm run dev
      fi"
    healthcheck:
      test: ["CMD", "sh", "-c", "curl -f http://localhost:${CLIENT_CONTAINER_PORT:-5173} || exit 1"]
      interval: ${HEALTH_CHECK_INTERVAL:-30s}
      timeout: ${HEALTH_CHECK_TIMEOUT:-10s}
      retries: ${HEALTH_CHECK_RETRIES:-3}
      start_period: ${CLIENT_HEALTH_CHECK_START_PERIOD:-30s}
    depends_on:
      redis:
        condition: service_healthy
      convex-backend:
        condition: service_healthy
    networks:
      - ${DOCKER_NETWORK_NAME:-ireadyoutube-network}
    restart: ${CLIENT_RESTART_POLICY:-unless-stopped}
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 256M
          cpus: '0.25'
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.client.rule=Host(\`${CLIENT_DOMAIN:-localhost}\`) && PathPrefix(\`/\`) "
      - "traefik.http.services.client.loadbalancer.server.port=${CLIENT_CONTAINER_PORT:-5173}"
      - "com.iareadyoutube.service=client"

  # =============================================================================
  # NGINX - Reverse Proxy (Production Only)
  # =============================================================================
  nginx:
    image: ${NGINX_IMAGE:-nginx:alpine}
    container_name: ${NGINX_CONTAINER_NAME:-ireadyoutube-nginx}
    ports:
      - "${NGINX_HOST_PORT:-80}:${NGINX_CONTAINER_PORT:-80}"
      - "${NGINX_SSL_HOST_PORT:-443}:${NGINX_SSL_CONTAINER_PORT:-443}"
    volumes:
      - ${NGINX_CONFIG_SOURCE:-./nginx/nginx.conf}:${NGINX_CONFIG_PATH:-/etc/nginx/nginx.conf}:ro
      - ${NGINX_SSL_DIR:-./ssl}:/etc/nginx/ssl:ro
      - nginx_cache:/var/cache/nginx
      - nginx_logs:/var/log/nginx
    environment:
      - NGINX_WORKER_PROCESSES=${NGINX_WORKER_PROCESSES:-auto}
      - NGINX_WORKER_CONNECTIONS=${NGINX_WORKER_CONNECTIONS:-1024}
    healthcheck:
      test: ["CMD", "sh", "-c", "curl -f http://localhost:${NGINX_CONTAINER_PORT:-80} || exit 1"]
      interval: ${HEALTH_CHECK_INTERVAL:-30s}
      timeout: ${HEALTH_CHECK_TIMEOUT:-10s}
      retries: ${HEALTH_CHECK_RETRIES:-3}
      start_period: ${NGINX_HEALTH_CHECK_START_PERIOD:-30s}
    depends_on:
      client:
        condition: service_healthy
      convex-backend:
        condition: service_healthy
    networks:
      - ${DOCKER_NETWORK_NAME:-ireadyoutube-network}
    restart: ${NGINX_RESTART_POLICY:-unless-stopped}
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.25'
        reservations:
          memory: 64M
          cpus: '0.1'
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.nginx.rule=Host(\`${NGINX_DOMAIN:-your-domain.com}\`)"
      - "traefik.http.services.nginx.loadbalancer.server.port=${NGINX_CONTAINER_PORT:-80}"
      - "com.iareadyoutube.service=nginx"
    profiles:
      - production

  # =============================================================================
  # MONITORING - Prometheus and Grafana (Optional)
  # =============================================================================
  prometheus:
    image: ${PROMETHEUS_IMAGE:-prom/prometheus:latest}
    container_name: ${PROMETHEUS_CONTAINER_NAME:-ireadyoutube-prometheus}
    ports:
      - "${PROMETHEUS_HOST_PORT:-9090}:9090"
    volumes:
      - ${PROMETHEUS_CONFIG_SOURCE:-./monitoring/prometheus.yml}:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'
    networks:
      - ${DOCKER_NETWORK_NAME:-ireadyoutube-network}
    restart: ${PROMETHEUS_RESTART_POLICY:-unless-stopped}
    profiles:
      - monitoring

  grafana:
    image: ${GRAFANA_IMAGE:-grafana/grafana:latest}
    container_name: ${GRAFANA_CONTAINER_NAME:-ireadyoutube-grafana}
    ports:
      - "${GRAFANA_HOST_PORT:-3000}:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ${GRAFANA_PROVISIONING_DIR:-./monitoring/grafana/provisioning}:/etc/grafana/provisioning:ro
    networks:
      - ${DOCKER_NETWORK_NAME:-ireadyoutube-network}
    restart: ${GRAFANA_RESTART_POLICY:-unless-stopped}
    profiles:
      - monitoring

# =============================================================================
# VOLUMES - Persistent Data Storage
# =============================================================================
volumes:
  redis_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${REDIS_DATA_PATH:-./data/redis}

  convex_backend_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${CONVEX_DATA_PATH:-./data/convex}

  convex_uploads:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${CONVEX_UPLOADS_DATA_PATH:-./data/uploads}

  nginx_cache:
    driver: local

  nginx_logs:
    driver: local

  prometheus_data:
    driver: local

  grafana_data:
    driver: local

# =============================================================================
# NETWORKS - Container Communication
# =============================================================================
networks:
  ${DOCKER_NETWORK_NAME:-ireadyoutube-network}:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.name: ${DOCKER_NETWORK_BRIDGE:-ireadyoutube-br}
    ipam:
      driver: default
      config:
        - subnet: ${DOCKER_NETWORK_SUBNET:-172.20.0.0/16}
          gateway: ${DOCKER_NETWORK_GATEWAY:-172.20.0.1}
    labels:
      - "com.iareadyoutube.network=main"
      - "com.iareadyoutube.project=${COMPOSE_PROJECT_NAME:-ireadyoutube}"

  monitoring:
    driver: bridge
    labels:
      - "com.iareadyoutube.network=monitoring"
      - "com.iareadyoutube.project=${COMPOSE_PROJECT_NAME:-ireadyoutube}"
    profiles:
      - monitoring

# =============================================================================
# SECRETS - Sensitive Configuration (Future Enhancement)
# =============================================================================
secrets:
  convex_admin_key:
    file: ${CONVEX_ADMIN_KEY_FILE:-./secrets/convex_admin_key.txt}
  assemblyai_api_key:
    file: ${ASSEMBLYAI_API_KEY_FILE:-./secrets/assemblyai_api_key.txt}
  youtube_api_key:
    file: ${YOUTUBE_API_KEY_FILE:-./secrets/youtube_api_key.txt}
  resend_api_key:
    file: ${RESEND_API_KEY_FILE:-./secrets/resend_api_key.txt}