# WordPress Static Generation - Full Stack Template
# ================================================
# Complete WordPress stack with static site generation
#
# Includes:
# - WordPress PHP 8.3 FPM
# - Nginx (admin access)
# - MariaDB 10.6
# - Redis caching
# - phpMyAdmin
# - Static web server
#
# Usage:
# 1. Copy this file to your project
# 2. Create .env file with required variables
# 3. Deploy via docker compose up -d
#
# Environment Variables Required:
# - APP_NAME: Unique stack identifier
# - DOMAIN: Primary domain (e.g., example.com)
# - WORDPRESS_DB_PASSWORD: Database password

services:
  # ============================================================
  # THE FACTORY (Backend - Sleeping)
  # ============================================================

  wordpress:
    image: wordpress:php8.3-fpm
    restart: "no"
    environment:
      # Database
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: ${WORDPRESS_DB_USER:-wordpress}
      WORDPRESS_DB_PASSWORD: ${WORDPRESS_DB_PASSWORD}
      WORDPRESS_DB_NAME: ${WORDPRESS_DB_NAME:-wordpress}
      # Redis caching
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_REDIS_HOST', 'redis');
        define('WP_REDIS_PORT', 6379);
        define('WP_CACHE', true);
        define('WP_DEBUG', false);
      # PHP settings
      PHP_UPLOAD_MAX_FILESIZE: ${PHP_UPLOAD_MAX_FILESIZE:-256M}
      PHP_POST_MAX_SIZE: ${PHP_POST_MAX_SIZE:-256M}
      PHP_MEMORY_LIMIT: ${PHP_MEMORY_LIMIT:-512M}
      PHP_MAX_EXECUTION_TIME: ${PHP_MAX_EXECUTION_TIME:-300}
      PHP_MAX_INPUT_TIME: ${PHP_MAX_INPUT_TIME:-300}
      PHP_MAX_INPUT_VARS: ${PHP_MAX_INPUT_VARS:-3000}
      # OPcache settings
      PHP_OPCACHE_MEMORY: ${PHP_OPCACHE_MEMORY:-128}
      PHP_OPCACHE_MAX_FILES: ${PHP_OPCACHE_MAX_FILES:-4000}
      PHP_OPCACHE_VALIDATE: ${PHP_OPCACHE_VALIDATE:-0}
    volumes:
      - wordpress_data:/var/www/html
      - static_bridge:/app/static-export
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - internal
    deploy:
      resources:
        limits:
          cpus: "${WORDPRESS_CPU_LIMIT:-1.0}"
          memory: "${WORDPRESS_MEMORY_LIMIT:-1G}"
    healthcheck:
      test: ["CMD-SHELL", "php-fpm-healthcheck || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  nginx-admin:
    image: nginx:alpine
    restart: "no"
    environment:
      - NGINX_CLIENT_MAX_BODY_SIZE=${NGINX_CLIENT_MAX_BODY_SIZE:-256M}
    volumes:
      - wordpress_data:/var/www/html:ro
    depends_on:
      wordpress:
        condition: service_healthy
    networks:
      - serverless-network
      - internal
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.${APP_NAME}-admin.rule=Host(`admin.${DOMAIN}`)"
      - "traefik.http.routers.${APP_NAME}-admin.entrypoints=websecure"
      - "traefik.http.routers.${APP_NAME}-admin.tls.certresolver=letsencrypt"
      - "traefik.http.services.${APP_NAME}-admin.loadbalancer.server.port=80"
    deploy:
      resources:
        limits:
          cpus: "${NGINX_CPU_LIMIT:-0.5}"
          memory: "${NGINX_MEMORY_LIMIT:-256M}"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  db:
    image: mariadb:10.6
    restart: "no"
    environment:
      MYSQL_DATABASE: ${WORDPRESS_DB_NAME:-wordpress}
      MYSQL_USER: ${WORDPRESS_DB_USER:-wordpress}
      MYSQL_PASSWORD: ${WORDPRESS_DB_PASSWORD}
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - internal
    deploy:
      resources:
        limits:
          cpus: "${DB_CPU_LIMIT:-1.0}"
          memory: "${DB_MEMORY_LIMIT:-1G}"
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  redis:
    image: redis:7-alpine
    restart: "no"
    command: >
      redis-server
      --maxmemory ${REDIS_MAXMEMORY:-256mb}
      --maxmemory-policy ${REDIS_MAXMEMORY_POLICY:-allkeys-lru}
    volumes:
      - redis_data:/data
    networks:
      - internal
    deploy:
      resources:
        limits:
          cpus: "${REDIS_CPU_LIMIT:-0.5}"
          memory: "${REDIS_MEMORY_LIMIT:-512M}"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    restart: "no"
    environment:
      - PMA_HOST=db
      - PMA_PORT=3306
      - UPLOAD_LIMIT=${PMA_UPLOAD_LIMIT:-256M}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - serverless-network
      - internal
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.${APP_NAME}-pma.rule=Host(`pma.${DOMAIN}`)"
      - "traefik.http.routers.${APP_NAME}-pma.entrypoints=websecure"
      - "traefik.http.routers.${APP_NAME}-pma.tls.certresolver=letsencrypt"
      - "traefik.http.services.${APP_NAME}-pma.loadbalancer.server.port=80"
    deploy:
      resources:
        limits:
          cpus: "${PHPMYADMIN_CPU_LIMIT:-0.5}"
          memory: "${PHPMYADMIN_MEMORY_LIMIT:-256M}"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # ============================================================
  # THE DELIVERY (Frontend - Always On)
  # ============================================================

  static-web:
    image: nginx:alpine
    restart: always
    volumes:
      - static_bridge:/usr/share/nginx/html:ro
    networks:
      - serverless-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.${APP_NAME}-static.rule=Host(`${DOMAIN}`) || Host(`www.${DOMAIN}`)"
      - "traefik.http.routers.${APP_NAME}-static.entrypoints=websecure"
      - "traefik.http.routers.${APP_NAME}-static.tls.certresolver=letsencrypt"
      - "traefik.http.services.${APP_NAME}-static.loadbalancer.server.port=80"
      # WWW to non-WWW redirect
      - "traefik.http.middlewares.${APP_NAME}-www-redirect.redirectregex.regex=^https://www\\.(.+)"
      - "traefik.http.middlewares.${APP_NAME}-www-redirect.redirectregex.replacement=https://$${1}"
      - "traefik.http.middlewares.${APP_NAME}-www-redirect.redirectregex.permanent=true"
      - "traefik.http.routers.${APP_NAME}-static.middlewares=${APP_NAME}-www-redirect"
    deploy:
      resources:
        limits:
          cpus: "${STATIC_CPU_LIMIT:-0.25}"
          memory: "${STATIC_MEMORY_LIMIT:-128M}"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

# ============================================================
# VOLUMES
# ============================================================

volumes:
  wordpress_data:
    name: "${APP_NAME}_wordpress_data"
  db_data:
    name: "${APP_NAME}_db_data"
  redis_data:
    name: "${APP_NAME}_redis_data"
  static_bridge:
    name: "${APP_NAME}_static_bridge"

# ============================================================
# NETWORKS
# ============================================================

networks:
  serverless-network:
    external: true
  internal:
    driver: bridge
    internal: true
