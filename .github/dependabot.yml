version: 2
updates:
  - package-ecosystem: npm
    directory: /client
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # Patch/minor dev tooling only. Majors are deliberately excluded so a
      # compiler or test-runner rewrite arrives as its own reviewable PR
      # instead of riding along with prettier patches — the TypeScript 5 -> 7
      # bump landed inside this group once and broke `npm ci` outright.
      dev-tooling:
        dependency-type: development
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: /server
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # Patch/minor dev tooling only. Majors are deliberately excluded so a
      # compiler or test-runner rewrite arrives as its own reviewable PR
      # instead of riding along with prettier patches — the TypeScript 5 -> 7
      # bump landed inside this group once and broke `npm ci` outright.
      dev-tooling:
        dependency-type: development
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: /agent
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # Patch/minor dev tooling only. Majors are deliberately excluded so a
      # compiler or test-runner rewrite arrives as its own reviewable PR
      # instead of riding along with prettier patches — the TypeScript 5 -> 7
      # bump landed inside this group once and broke `npm ci` outright.
      dev-tooling:
        dependency-type: development
        update-types:
          - minor
          - patch

  # Also covers the `container.image` pins in .github/workflows/ci.yml, so a
  # node bump reaches CI and the Dockerfiles together. ci-gates.test.ts fails
  # if those two majors ever drift apart.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly

  - package-ecosystem: docker
    directory: /server
    schedule:
      interval: monthly

  - package-ecosystem: docker
    directory: /client
    schedule:
      interval: monthly

  - package-ecosystem: docker
    directory: /agent
    schedule:
      interval: monthly
